<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../../">
<title>{{TITLE}}｜{{SITE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:site_name" content="{{SITE_TITLE}}">
{{OG_URL}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#dcd6c7;--ink:#3b3a44;--paper:#fbfaf6;--line:#b3ab9a;--muted:#6b6558;--accent:#cf4f36;color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161a33;--ink:#e8e1c8;--paper:#1f2444;--line:#3a4270;--muted:#a9a7c4;--accent:#f07a3a;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:760px;margin:0 auto;padding:16px 20px}
.plate,.btn{font-family:"DotGothic16",sans-serif;background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:8px 12px;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
.btn{min-height:44px;display:inline-flex;align-items:center}
main{max-width:760px;margin:8px auto 48px;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:32px 22px 48px}
@media (max-width:800px){main{margin:8px 10px 32px}}
.post{max-width:38em;margin:0 auto}
.post h1{font-family:"DotGothic16",sans-serif;font-weight:400;font-size:28px;line-height:1.4;margin:0 0 6px}
.meta{color:var(--muted);font-size:13px;margin:0 0 24px}
.post p,.post li{font-size:17px;line-height:1.95}
.post p{margin:0 0 1em}
.post h2,.post h3{font-family:"DotGothic16",sans-serif;font-weight:400;line-height:1.5;margin:1.8em 0 .6em}
.post h2{font-size:21px;border-bottom:3px dashed var(--line);padding-bottom:4px}
.post h3{font-size:18px}
.post ul,.post ol{padding-left:1.4em;margin:0 0 1em}
.post a{color:var(--accent);text-underline-offset:3px}
.post img{max-width:100%;height:auto;display:block;margin:1em 0}
.post blockquote{margin:0 0 1em;padding:4px 0 4px 16px;border-left:4px solid var(--line);color:var(--muted)}
.post code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--bg);padding:1px 4px}
.post pre{background:var(--bg);padding:12px 14px;overflow-x:auto;margin:0 0 1em}
.post pre code{background:none;padding:0}
.post hr{border:0;border-top:3px dashed var(--line);margin:2em 0}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <a class="plate" href="./">{{SITE_TITLE}}</a>
  <a class="btn" href="./#/post/{{SLUG}}">地図の上で読む</a>
</header>
<main>
  <article class="post">
    <h1>{{TITLE}}</h1>
    <p class="meta">{{DATE}}　{{CATEGORY}}</p>
    {{CONTENT}}
  </article>
</main>
</body>
</html>
